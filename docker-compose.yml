services:
  app:
    image: ghcr.io/vmhq/news-curator:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8391}:8391"
    environment:
      PORT: "8391"
      API_KEY: "${API_KEY}"
      CURATIONS_DIR: "/data/curations"
      UPLOADS_DIR: "/data/uploads"
    volumes:
      - curations:/data/curations
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8391/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  curations:
  uploads:
