<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="#3b82f6" opacity="0.08"/>
  <circle cx="150" cy="520" r="220" fill="#8b5cf6" opacity="0.06"/>
  <circle cx="900" cy="500" r="120" fill="#06b6d4" opacity="0.05"/>
  <!-- Accent line -->
  <rect x="100" y="200" width="80" height="4" rx="2" fill="url(#accent)"/>
  <!-- Title -->
  <text x="100" y="270" font-family="Inter,system-ui,sans-serif" font-size="56" font-weight="800" fill="#f8fafc">Daily Brief</text>
  <!-- Subtitle -->
  <text x="100" y="330" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Noticias de tecnología e IA</text>
  <text x="100" y="370" font-family="Inter,system-ui,sans-serif" font-size="24" font-weight="500" fill="#94a3b8">curadas diariamente</text>
  <!-- Bottom accent -->
  <rect x="100" y="430" width="300" height="2" rx="1" fill="#334155"/>
  <!-- Tagline -->
  <text x="100" y="480" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="400" fill="#64748b">dailyb.vmhq.cl</text>
  <!-- Emoji -->
  <text x="1050" y="380" font-size="120" text-anchor="middle">📰</text>
</svg>